# Railway service configuration for Caelia Motherboard Backend

[build]
builder = "dockerfile"
buildCommand = "npm ci"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# Port mapping
[[services]]
name = "backend"
port = 8787
protocol = "http"
